name: Trigger Main Workflow

on:
  workfl.ow_run:
    workflows: ["Forever Bot"]         # نام اصلی workflow
    types:
      - completed

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Call GitHub API to re-run main workflow
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          curl -L -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.PAT_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/TGBOT.yml/dispatches \
            -d '{"ref":"main"}'