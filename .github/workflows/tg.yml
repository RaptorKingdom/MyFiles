name: Telegram MTProto Proxy via Bore Tunnel

on:
  workflow_dispatch:
    inputs:
      duration:
        description: 'مدت زمان اجرا (دقیقه - حداکثر ۳۵۰)'
        required: true
        default: '60'

jobs:
  proxy:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: دریافت کد مخزن
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: نصب پروکسی MTProto و اجرای آن
        run: |
          pip install mtprotoproxy
          SECRET=$(openssl rand -hex 16)
          echo "SECRET=$SECRET" >> $GITHUB_ENV

          mtprotoproxy -p 8888 -s $SECRET &
          sleep 2
          echo "✅ پروکسی MTProto روی پورت 8888 اجرا شد"

      - name: نصب و راه‌اندازی تونل Bore
        run: |
          # دانلود نسخه 0.6.0 bore برای لینوکس
          curl -L https://github.com/ekzhang/bore/releases/download/v0.6.0/bore-x86_64-unknown-linux-musl.tar.gz -o bore.tar.gz
          tar xzf bore.tar.gz
          chmod +x bore
          sudo mv bore /usr/local/bin/

          echo "🌐 در حال ایجاد تونل TCP روی bore.pub..."
          bore local 8888 --to bore.pub > bore.log 2>&1 &
          
          # انتظار برای آماده شدن تونل
          sleep 5

          # استخراج خط حاوی "listening on"
          BORE_LINE=$(grep 'listening on' bore.log | head -1)
          if [ -z "$BORE_LINE" ]; then
            echo "❌ تونل ساخته نشد. خروجی bore:"
            cat bore.log
            exit 1
          fi

          # مثال: "listening on bore.pub:12345"
          BORE_ADDR=$(echo "$BORE_LINE" | grep -oP 'bore\.pub:\d+')
          HOST=$(echo "$BORE_ADDR" | cut -d: -f1)
          PORT=$(echo "$BORE_ADDR" | cut -d: -f2)

          if [ -z "$HOST" ] || [ -z "$PORT" ]; then
            echo "❌ خطا در استخراج host/port از: $BORE_LINE"
            exit 1
          fi

          echo "HOST=$HOST" >> $GITHUB_ENV
          echo "PORT=$PORT" >> $GITHUB_ENV

          PROXY_LINK="tg://proxy?server=$HOST&port=$PORT&secret=$SECRET"
          echo "PROXY_LINK=$PROXY_LINK" >> $GITHUB_ENV

          echo "✅ تونل ساخته شد: $HOST:$PORT"
          echo "🔗 لینک پروکسی: $PROXY_LINK"

          # آپلود فوری لینک در مخزن
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          rm -f link.md
          git pull origin main
          echo "$PROXY_LINK" > link.md
          git add link.md
          git commit -m "🔗 لینک پروکسی آماده شد" || echo "⚠️ تغییری نبود"
          git push

      - name: نمایش اطلاعات تونل
        run: |
          echo "🔗 آدرس تونل: ${{ env.HOST }}:${{ env.PORT }}"
          echo "🔐 Secret: ${{ env.SECRET }}"

      - name: نگهبانی و زنده نگه‌داشتن تونل
        run: |
          DURATION=${{ github.event.inputs.duration }}
          if [ "$DURATION" -gt 350 ]; then DURATION=350; fi
          END_TIME=$(date -d "$DURATION minutes" +%s)
          SECRET=${{ env.SECRET }}

          echo "⏳ نگهبانی تونل برای $DURATION دقیقه..."

          while [ $(date +%s) -lt $END_TIME ]; do
            REMAINING=$((END_TIME - $(date +%s)))
            echo "[$(date +%H:%M:%S)] زمان باقی‌مانده: $((REMAINING/60)) دقیقه و $((REMAINING%60)) ثانیه"

            if ! pgrep -x bore > /dev/null; then
              echo "⚠️ تونل bore قطع شده، راه‌اندازی مجدد..."

              pkill bore 2>/dev/null || true
              sleep 2

              bore local 8888 --to bore.pub > bore.log 2>&1 &
              sleep 5

              NEW_LINE=$(grep 'listening on' bore.log | head -1)
              if [ -n "$NEW_LINE" ]; then
                NEW_ADDR=$(echo "$NEW_LINE" | grep -oP 'bore\.pub:\d+')
                HOST=$(echo "$NEW_ADDR" | cut -d: -f1)
                PORT=$(echo "$NEW_ADDR" | cut -d: -f2)
                PROXY_LINK="tg://proxy?server=$HOST&port=$PORT&secret=$SECRET"
                echo "🔄 تونل جدید: $HOST:$PORT"

                git config user.name "github-actions[bot]"
                git config user.email "github-actions[bot]@users.noreply.github.com"
                rm -f link.md
                git pull origin main
                echo "$PROXY_LINK" > link.md
                git add link.md
                git commit -m "🔄 به‌روزرسانی لینک پروکسی (تغییر تونل)" || echo "⚠️ تغییری نبود"
                git push
              else
                echo "❌ راه‌اندازی مجدد تونل شکست خورد"
              fi
            fi

            sleep 30
          done

          echo "✅ زمان نگهبانی پایان یافت"

      - name: آپلود نهایی لینک (اختیاری)
        if: always()
        run: |
          if [ -n "${{ env.PROXY_LINK }}" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            rm -f link.md
            git pull origin main
            echo "${{ env.PROXY_LINK }}" > link.md
            git add link.md
            git commit -m "⏹ پایان اجرا - آخرین لینک پروکسی" || echo "⚠️ تغییری نبود"
            git push
          fi