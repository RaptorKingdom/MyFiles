name: Telegram MTProto Proxy via Bore Tunnel

on:
  workflow_dispatch:
    inputs:
      duration:
        description: 'مدت زمان اجرا (دقیقه - حداکثر ۳۵۰)'
        required: true
        default: '60'

jobs:
  proxy:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: دریافت کد مخزن
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: دانلود و اجرای پروکسی MTProto (mtg)
        run: |
          # تولید secret تصادفی (32 کاراکتر هگز = 16 بایت)
          SECRET=$(openssl rand -hex 16)
          echo "SECRET=$SECRET" >> $GITHUB_ENV

          # دانلود mtg (پروکسی مستقل MTProto)
          curl -L https://github.com/9seconds/mtg/releases/download/v2.1.7/mtg-linux-amd64 -o mtg
          chmod +x mtg
          sudo mv mtg /usr/local/bin/

          # اجرای پروکسی ساده MTProto روی پورت 8888
          nohup mtg run -b 0.0.0.0:8888 $SECRET --prefer-ss=false > mtg.log 2>&1 &
          sleep 3

          # بررسی اینکه پورت 8888 در حال گوش دادن است
          if ! ss -tlnp | grep -q 8888; then
            echo "❌ پروکسی MTProto روی پورت 8888 اجرا نشد"
            cat mtg.log
            exit 1
          fi
          echo "✅ پروکسی MTProto (mtg) روی پورت 8888 اجرا شد"

      - name: دانلود و نصب آخرین نسخه bore
        run: |
          DOWNLOAD_URL=$(curl -s https://api.github.com/repos/ekzhang/bore/releases/latest | \
            jq -r '.assets[] | select(.name | test("x86_64.*linux|linux.*x86_64")) | .browser_download_url' | head -1)

          if [ -z "$DOWNLOAD_URL" ]; then
            echo "❌ دریافت لینک دانلود ناموفق بود"
            exit 1
          fi

          echo "📥 دانلود از: $DOWNLOAD_URL"

          if [[ "$DOWNLOAD_URL" == *.zip ]]; then
            curl -L "$DOWNLOAD_URL" -o bore.zip
            unzip -o bore.zip
          elif [[ "$DOWNLOAD_URL" == *.tar.gz ]]; then
            curl -L "$DOWNLOAD_URL" -o bore.tar.gz
            tar xzf bore.tar.gz
          else
            curl -L "$DOWNLOAD_URL" -o bore
          fi

          if [ ! -f bore ]; then
            BINARY_NAME=$(ls bore* 2>/dev/null | head -1)
            if [ -n "$BINARY_NAME" ] && [ "$BINARY_NAME" != "bore" ]; then
              mv "$BINARY_NAME" bore
            fi
          fi

          chmod +x bore
          sudo mv bore /usr/local/bin/
          echo "✅ bore نصب شد"

      - name: ساخت تونل TCP با bore و دریافت آدرس
        id: tunnel
        run: |
          echo "🌐 در حال ایجاد تونل TCP روی bore.pub..."
          rm -f bore.log
          bore local 8888 --to bore.pub > bore.log 2>&1 &
          BORE_PID=$!

          # انتظار تا ظاهر شدن آدرس (حداکثر ۲۰ ثانیه)
          for i in {1..20}; do
            if grep -q 'listening at' <(cat bore.log | sed 's/\x1b\[[0-9;]*m//g'); then
              break
            fi
            if ! kill -0 $BORE_PID 2>/dev/null; then
              echo "❌ پروسه bore متوقف شد"
              cat bore.log
              exit 1
            fi
            sleep 1
          done

          BORE_LINE=$(cat bore.log | sed 's/\x1b\[[0-9;]*m//g' | grep 'listening at' | head -1)
          if [ -z "$BORE_LINE" ]; then
            echo "❌ تونل ساخته نشد. خروجی bore:"
            cat bore.log
            exit 1
          fi

          BORE_ADDR=$(echo "$BORE_LINE" | grep -oP 'bore\.pub:\d+')
          HOST=$(echo "$BORE_ADDR" | cut -d: -f1)
          PORT=$(echo "$BORE_ADDR" | cut -d: -f2)

          if [ -z "$HOST" ] || [ -z "$PORT" ]; then
            echo "❌ خطا در استخراج host/port از: $BORE_LINE"
            exit 1
          fi

          echo "HOST=$HOST" >> $GITHUB_ENV
          echo "PORT=$PORT" >> $GITHUB_ENV

          PROXY_LINK="tg://proxy?server=$HOST&port=$PORT&secret=$SECRET"
          echo "PROXY_LINK=$PROXY_LINK" >> $GITHUB_ENV

          echo "✅ تونل ساخته شد: $HOST:$PORT"
          echo "🔗 لینک پروکسی: $PROXY_LINK"

          # آپلود فوری لینک
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          rm -f link.md
          git pull origin main
          echo "$PROXY_LINK" > link.md
          git add link.md
          git commit -m "🔗 لینک پروکسی آماده شد" || echo "⚠️ تغییری نبود"
          git push

      - name: نمایش اطلاعات تونل
        run: |
          echo "🔗 آدرس تونل: ${{ env.HOST }}:${{ env.PORT }}"
          echo "🔐 Secret: ${{ env.SECRET }}"

      - name: نگهبانی و زنده نگه‌داشتن تونل
        run: |
          DURATION=${{ github.event.inputs.duration }}
          if [ "$DURATION" -gt 350 ]; then DURATION=350; fi
          END_TIME=$(date -d "$DURATION minutes" +%s)
          SECRET=${{ env.SECRET }}

          echo "⏳ نگهبانی تونل برای $DURATION دقیقه..."

          while [ $(date +%s) -lt $END_TIME ]; do
            REMAINING=$((END_TIME - $(date +%s)))
            echo "[$(date +%H:%M:%S)] زمان باقی‌مانده: $((REMAINING/60)) دقیقه و $((REMAINING%60)) ثانیه"

            if ! pgrep -x bore > /dev/null; then
              echo "⚠️ تونل bore قطع شده، راه‌اندازی مجدد..."

              pkill bore 2>/dev/null || true
              sleep 2

              rm -f bore.log
              bore local 8888 --to bore.pub > bore.log 2>&1 &
              BORE_PID=$!

              for i in {1..20}; do
                if grep -q 'listening at' <(cat bore.log | sed 's/\x1b\[[0-9;]*m//g'); then
                  break
                fi
                if ! kill -0 $BORE_PID 2>/dev/null; then
                  break
                fi
                sleep 1
              done

              NEW_LINE=$(cat bore.log | sed 's/\x1b\[[0-9;]*m//g' | grep 'listening at' | head -1)
              if [ -n "$NEW_LINE" ]; then
                NEW_ADDR=$(echo "$NEW_LINE" | grep -oP 'bore\.pub:\d+')
                HOST=$(echo "$NEW_ADDR" | cut -d: -f1)
                PORT=$(echo "$NEW_ADDR" | cut -d: -f2)
                PROXY_LINK="tg://proxy?server=$HOST&port=$PORT&secret=$SECRET"
                echo "🔄 تونل جدید: $HOST:$PORT"

                git config user.name "github-actions[bot]"
                git config user.email "github-actions[bot]@users.noreply.github.com"
                rm -f link.md
                git pull origin main
                echo "$PROXY_LINK" > link.md
                git add link.md
                git commit -m "🔄 به‌روزرسانی لینک پروکسی (تغییر تونل)" || echo "⚠️ تغییری نبود"
                git push
              else
                echo "❌ راه‌اندازی مجدد تونل شکست خورد"
              fi
            fi

            sleep 30
          done

          echo "✅ زمان نگهبانی پایان یافت"

      - name: آپلود نهایی لینک (اختیاری)
        if: always()
        run: |
          if [ -n "${{ env.PROXY_LINK }}" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            rm -f link.md
            git pull origin main
            echo "${{ env.PROXY_LINK }}" > link.md
            git add link.md
            git commit -m "⏹ پایان اجرا - آخرین لینک پروکسی" || echo "⚠️ تغییری نبود"
            git push
          fi