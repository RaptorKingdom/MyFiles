name: MTProto Proxy (alexbers + bore)

on:
  workflow_dispatch:
    inputs:
      duration:
        description: 'مدت زمان اجرا (دقیقه - حداکثر ۳۵۰)'
        required: true
        default: '60'

jobs:
  proxy:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: دریافت کد مخزن
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: نصب Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: کلون پروژه اصلی mtprotoproxy و پیکربندی
        run: |
          git clone https://github.com/alexbers/mtprotoproxy.git
          cd mtprotoproxy

          SECRET=$(openssl rand -hex 16)
          echo "SECRET=$SECRET" >> $GITHUB_ENV

          # تنظیم پورت، کلید مخفی و دامنه Fake TLS (طبق مستندات شما)
          cat > config.py <<EOF
          PORT = 8888
          USERS = {"$SECRET": "proxyuser"}
          TLS_DOMAIN = "www.google.com"
          EOF

          # نصب نیازمندی‌ها (اگر فایل requirements.txt وجود داشته باشد)
          pip install -r requirements.txt 2>/dev/null || true
          echo "✅ پروژه پیکربندی شد"

      - name: اجرای پروکسی MTProto در پس‌زمینه
        run: |
          cd mtprotoproxy
          nohup python3 mtprotoproxy.py > ../proxy.log 2>&1 &
          sleep 3

          if ! ss -tlnp | grep -q 8888; then
            echo "❌ پروکسی روی پورت 8888 اجرا نشد"
            cat ../proxy.log
            exit 1
          fi
          echo "✅ پروکسی MTProto روی پورت 8888 اجرا شد"

      - name: نصب bore (آخرین نسخه)
        run: |
          DOWNLOAD_URL=$(curl -s https://api.github.com/repos/ekzhang/bore/releases/latest | \
            jq -r '.assets[] | select(.name | test("x86_64.*linux|linux.*x86_64")) | .browser_download_url' | head -1)
          echo "📥 دانلود bore از: $DOWNLOAD_URL"
          curl -L "$DOWNLOAD_URL" -o bore.tar.gz
          tar xzf bore.tar.gz
          BINARY=$(ls bore* 2>/dev/null | grep -v '\.tar\.gz$' | head -1)
          chmod +x "$BINARY"
          sudo mv "$BINARY" /usr/local/bin/bore
          echo "✅ bore نصب شد"

      - name: ساخت تونل TCP و آپلود لینک
        id: tunnel
        run: |
          rm -f bore.log
          bore local 8888 --to bore.pub > bore.log 2>&1 &
          BORE_PID=$!

          # انتظار برای آماده شدن تونل
          for i in {1..20}; do
            if grep -q 'listening at' <(cat bore.log | sed 's/\x1b\[[0-9;]*m//g'); then
              break
            fi
            if ! kill -0 $BORE_PID 2>/dev/null; then
              echo "❌ پروسه bore متوقف شد"
              cat bore.log
              exit 1
            fi
            sleep 1
          done

          BORE_LINE=$(cat bore.log | sed 's/\x1b\[[0-9;]*m//g' | grep 'listening at' | head -1)
          if [ -z "$BORE_LINE" ]; then
            echo "❌ تونل ساخته نشد"
            cat bore.log
            exit 1
          fi

          BORE_ADDR=$(echo "$BORE_LINE" | grep -oP 'bore\.pub:\d+')
          HOST=$(echo "$BORE_ADDR" | cut -d: -f1)
          PORT=$(echo "$BORE_ADDR" | cut -d: -f2)
          
          PROXY_LINK="tg://proxy?server=$HOST&port=$PORT&secret=$SECRET"
          echo "PROXY_LINK=$PROXY_LINK" >> $GITHUB_ENV

          echo "✅ تونل ساخته شد: $HOST:$PORT"
          echo "🔗 لینک پروکسی: $PROXY_LINK"

          # آپلود در مخزن
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          rm -f link.md
          git pull origin main
          echo "$PROXY_LINK" > link.md
          git add link.md
          git commit -m "🔗 لینک پروکسی آماده شد" || echo "⚠️ تغییری نبود"
          git push

      - name: نمایش اطلاعات
        run: |
          echo "🔗 آدرس تونل: ${{ env.HOST }}:${{ env.PORT }}"
          echo "🔐 Secret: ${{ env.SECRET }}"

      - name: نگهبانی (Keep Alive) تا پایان زمان
        run: |
          DURATION=${{ github.event.inputs.duration }}
          if [ "$DURATION" -gt 350 ]; then DURATION=350; fi
          END_TIME=$(date -d "$DURATION minutes" +%s)
          SECRET=${{ env.SECRET }}

          echo "⏳ نگهبانی تونل برای $DURATION دقیقه..."

          while [ $(date +%s) -lt $END_TIME ]; do
            REMAINING=$((END_TIME - $(date +%s)))
            echo "[$(date +%H:%M:%S)] زمان باقی‌مانده: $((REMAINING/60)) دقیقه و $((REMAINING%60)) ثانیه"

            if ! pgrep -x bore > /dev/null; then
              echo "⚠️ تونل bore قطع شد، راه‌اندازی مجدد..."
              pkill bore 2>/dev/null || true
              sleep 2
              rm -f bore.log
              bore local 8888 --to bore.pub > bore.log 2>&1 &
              BORE_PID=$!
              for i in {1..20}; do
                if grep -q 'listening at' <(cat bore.log | sed 's/\x1b\[[0-9;]*m//g'); then
                  break
                fi
                if ! kill -0 $BORE_PID 2>/dev/null; then
                  break
                fi
                sleep 1
              done
              NEW_LINE=$(cat bore.log | sed 's/\x1b\[[0-9;]*m//g' | grep 'listening at' | head -1)
              if [ -n "$NEW_LINE" ]; then
                NEW_ADDR=$(echo "$NEW_LINE" | grep -oP 'bore\.pub:\d+')
                HOST=$(echo "$NEW_ADDR" | cut -d: -f1)
                PORT=$(echo "$NEW_ADDR" | cut -d: -f2)
                PROXY_LINK="tg://proxy?server=$HOST&port=$PORT&secret=$SECRET"
                echo "🔄 تونل جدید: $HOST:$PORT"
                git config user.name "github-actions[bot]"
                git config user.email "github-actions[bot]@users.noreply.github.com"
                rm -f link.md
                git pull origin main
                echo "$PROXY_LINK" > link.md
                git add link.md
                git commit -m "🔄 به‌روزرسانی لینک (تغییر تونل)" || echo "⚠️ تغییری نبود"
                git push
              else
                echo "❌ راه‌اندازی مجدد تونل شکست خورد"
              fi
            fi
            sleep 30
          done
          echo "✅ زمان نگهبانی پایان یافت"

      - name: آپلود نهایی (اختیاری)
        if: always()
        run: |
          if [ -n "${{ env.PROXY_LINK }}" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            rm -f link.md
            git pull origin main
            echo "${{ env.PROXY_LINK }}" > link.md
            git add link.md
            git commit -m "⏹ پایان اجرا" || echo "⚠️ تغییری نبود"
            git push
          fi