name: Fast Telegram Proxy via Cloudflare Tunnel

on:
  workflow_dispatch:
    inputs:
      duration:
        description: 'مدت زمان اجرا (دقیقه - حداکثر ۳۵۰)'
        required: true
        default: '60'

jobs:
  tunnel-proxy:
    runs-on: ubuntu-latest

    steps:
      - name: دریافت کد مخزن
        uses: actions/checkout@v4
        with:
          ref: main   # یا نام شاخه‌تان
          fetch-depth: 0

      - name: اجرای پروکسی faketls (mtg)
        run: |
          SECRET=$(openssl rand -hex 16)
          echo "SECRET=$SECRET" >> $GITHUB_ENV

          curl -L https://github.com/9seconds/mtg/releases/download/v2.1.7/mtg-linux-amd64 -o mtg
          chmod +x mtg
          sudo mv mtg /usr/local/bin/

          mtg run -b 0.0.0.0:8443 $SECRET --prefer-ss=false --stats-bind=127.0.0.1:3128 > mtg.log 2>&1 &
          sleep 3
          echo "✅ پروکسی faketls روی پورت 8443 اجرا شد"

      - name: نصب و راه‌اندازی تونل Cloudflare
        run: |
          curl -L https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o cloudflared
          chmod +x cloudflared
          sudo mv cloudflared /usr/local/bin/

          echo "🌐 در حال ایجاد تونل HTTP برای پروکسی..."
          cloudflared tunnel --url http://localhost:8443 --no-autoupdate > cloudflare.log 2>&1 &

          sleep 8

          TUNNEL_HOST=$(grep -oP 'https://[a-zA-Z0-9.-]+\.trycloudflare\.com' cloudflare.log | head -n1)

          if [ -z "$TUNNEL_HOST" ]; then
            echo "❌ خطا در ساخت تونل"
            cat cloudflare.log
            exit 1
          fi

          HOST=${TUNNEL_HOST#https://}
          PORT=443

          echo "HOST=$HOST" >> $GITHUB_ENV
          echo "PORT=$PORT" >> $GITHUB_ENV

          PROXY_LINK="tg://proxy?server=$HOST&port=$PORT&secret=$SECRET"
          echo "$PROXY_LINK" > link.md
          echo "PROXY_LINK=$PROXY_LINK" >> $GITHUB_ENV

          echo "✅ تونل ساخته شد: $TUNNEL_HOST"
          echo "🔗 لینک پروکسی: $PROXY_LINK"

          # هماهنگ‌سازی و push
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          git add link.md
          git commit -m "🔗 لینک پروکسی آماده شد" || echo "⚠️ تغییری برای commit وجود نداشت"
          git push

      - name: نمایش و ذخیره اطلاعات تونل
        run: |
          echo "🔗 آدرس تونل: ${{ env.HOST }}:${{ env.PORT }}"
          echo "🔐 Secret: ${{ env.SECRET }}"

      - name: نگهبانی و زنده نگه‌داشتن تونل
        run: |
          DURATION=${{ github.event.inputs.duration }}
          if [ "$DURATION" -gt 350 ]; then DURATION=350; fi
          END_TIME=$(date -d "$DURATION minutes" +%s)
          SECRET=${{ env.SECRET }}

          echo "⏳ نگهبانی تونل برای $DURATION دقیقه..."

          while [ $(date +%s) -lt $END_TIME ]; do
            REMAINING=$((END_TIME - $(date +%s)))
            echo "[$(date +%H:%M:%S)] زمان باقی‌مانده: $((REMAINING/60)) دقیقه و $((REMAINING%60)) ثانیه"

            if ! pgrep -x cloudflared > /dev/null; then
              echo "⚠️ تونل قطع شده، راه‌اندازی مجدد..."

              pkill cloudflared 2>/dev/null || true
              sleep 2

              cloudflared tunnel --url http://localhost:8443 --no-autoupdate > cloudflare.log 2>&1 &
              sleep 8

              NEW_HOST_URL=$(grep -oP 'https://[a-zA-Z0-9.-]+\.trycloudflare\.com' cloudflare.log | head -n1)
              if [ -n "$NEW_HOST_URL" ]; then
                HOST=${NEW_HOST_URL#https://}
                PORT=443
                PROXY_LINK="tg://proxy?server=$HOST&port=$PORT&secret=$SECRET"
                echo "$PROXY_LINK" > link.md
                echo "🔄 تونل جدید: $HOST"

                git config user.name "github-actions[bot]"
                git config user.email "github-actions[bot]@users.noreply.github.com"
                git pull --rebase origin main
                git add link.md
                git commit -m "🔄 به‌روزرسانی لینک پروکسی (تغییر تونل)" || echo "⚠️ تغییری نبود"
                git push
              else
                echo "❌ راه‌اندازی مجدد تونل شکست خورد"
              fi
            fi

            sleep 30
          done

          echo "✅ زمان نگهبانی پایان یافت"

      - name: آپلود نهایی لینک (اختیاری)
        if: always()
        run: |
          if [ -f link.md ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git pull --rebase origin main
            git add link.md
            git commit -m "⏹ پایان اجرا - آخرین لینک پروکسی" || echo "⚠️ تغییری نبود"
            git push
          fi