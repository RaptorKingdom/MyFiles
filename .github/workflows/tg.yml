name: MTProto Proxy (Simple, no Fake TLS)

on:
  workflow_dispatch:
    inputs:
      duration:
        description: 'مدت زمان اجرا (دقیقه - حداکثر ۳۵۰)'
        required: true
        default: '60'

jobs:
  proxy:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: دریافت کد مخزن
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: نصب Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: کلون پروژه اصلی و پیکربندی (بدون Fake TLS)
        run: |
          git clone https://github.com/alexbers/mtprotoproxy.git
          cd mtprotoproxy

          SECRET=$(openssl rand -hex 16)
          echo "SECRET=$SECRET" >> $GITHUB_ENV

          # تنظیمات بدون TLS_DOMAIN → پروکسی ساده MTProto
          cat > config.py <<EOF
          PORT = 8888
          USERS = {"$SECRET": "proxyuser"}
          EOF

          pip install -r requirements.txt 2>/dev/null || true
          echo "✅ پروژه پیکربندی شد (ساده)"

      - name: اجرای پروکسی MTProto روی پورت 8888
        run: |
          cd mtprotoproxy
          nohup python3 mtprotoproxy.py > ../proxy.log 2>&1 &
          sleep 3
          if ! ss -tlnp | grep -q 8888; then
            echo "❌ پروکسی اجرا نشد"
            cat ../proxy.log
            exit 1
          fi
          echo "✅ پروکسی MTProto (ساده) روی پورت 8888 آماده است"

      - name: نصب آخرین نسخه bore
        run: |
          DOWNLOAD_URL=$(curl -s https://api.github.com/repos/ekzhang/bore/releases/latest | \
            jq -r '.assets[] | select(.name | test("x86_64.*linux|linux.*x86_64")) | .browser_download_url' | head -1)
          curl -L "$DOWNLOAD_URL" -o bore.tar.gz
          tar xzf bore.tar.gz
          BINARY=$(ls bore* 2>/dev/null | grep -v '\.tar\.gz$' | head -1)
          chmod +x "$BINARY"
          sudo mv "$BINARY" /usr/local/bin/bore

      - name: ساخت تونل TCP و آپلود لینک
        id: tunnel
        run: |
          rm -f bore.log
          bore local 8888 --to bore.pub > bore.log 2>&1 &
          BORE_PID=$!
          for i in {1..20}; do
            if grep -q 'listening at' <(cat bore.log | sed 's/\x1b\[[0-9;]*m//g'); then
              break
            fi
            kill -0 $BORE_PID 2>/dev/null || { cat bore.log; exit 1; }
            sleep 1
          done

          BORE_LINE=$(cat bore.log | sed 's/\x1b\[[0-9;]*m//g' | grep 'listening at' | head -1)
          BORE_ADDR=$(echo "$BORE_LINE" | grep -oP 'bore\.pub:\d+')
          HOST=$(echo "$BORE_ADDR" | cut -d: -f1)
          PORT=$(echo "$BORE_ADDR" | cut -d: -f2)
          
          PROXY_LINK="tg://proxy?server=$HOST&port=$PORT&secret=$SECRET"
          echo "PROXY_LINK=$PROXY_LINK" >> $GITHUB_ENV
          echo "✅ تونل: $HOST:$PORT"
          echo "🔗 لینک: $PROXY_LINK"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          rm -f link.md
          git pull origin main
          echo "$PROXY_LINK" > link.md
          git add link.md
          git commit -m "🔗 لینک پروکسی آماده" || echo "بدون تغییر"
          git push

      - name: نگهبانی (Keep Alive)
        run: |
          DURATION=${{ github.event.inputs.duration }}
          [ "$DURATION" -gt 350 ] && DURATION=350
          END_TIME=$(date -d "$DURATION minutes" +%s)
          SECRET=${{ env.SECRET }}

          while [ $(date +%s) -lt $END_TIME ]; do
            REMAINING=$((END_TIME - $(date +%s)))
            echo "[$(date +%H:%M:%S)] $((REMAINING/60)) دقیقه مانده"
            if ! pgrep -x bore > /dev/null; then
              echo "⚠️ تونل قطع، راه‌اندازی مجدد..."
              pkill bore 2>/dev/null || true
              sleep 2
              rm -f bore.log
              bore local 8888 --to bore.pub > bore.log 2>&1 &
              BORE_PID=$!
              for i in {1..20}; do
                grep -q 'listening at' <(cat bore.log | sed 's/\x1b\[[0-9;]*m//g') && break
                kill -0 $BORE_PID 2>/dev/null || break
                sleep 1
              done
              NEW_ADDR=$(cat bore.log | sed 's/\x1b\[[0-9;]*m//g' | grep 'listening at' | grep -oP 'bore\.pub:\d+' | head -1)
              if [ -n "$NEW_ADDR" ]; then
                HOST=$(echo "$NEW_ADDR" | cut -d: -f1)
                PORT=$(echo "$NEW_ADDR" | cut -d: -f2)
                PROXY_LINK="tg://proxy?server=$HOST&port=$PORT&secret=$SECRET"
                echo "🔄 تونل جدید: $HOST:$PORT"
                git config user.name "github-actions[bot]"
                git config user.email "github-actions[bot]@users.noreply.github.com"
                rm -f link.md
                git pull origin main
                echo "$PROXY_LINK" > link.md
                git add link.md
                git commit -m "🔄 به‌روزرسانی لینک" || echo "بدون تغییر"
                git push
              fi
            fi
            sleep 30
          done

      - name: آپلود نهایی
        if: always()
        run: |
          if [ -n "${{ env.PROXY_LINK }}" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            rm -f link.md
            git pull origin main
            echo "${{ env.PROXY_LINK }}" > link.md
            git add link.md
            git commit -m "⏹ پایان" || echo "بدون تغییر"
            git push
          fi