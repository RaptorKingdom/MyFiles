name: Forever Bot

on:
  workflow_dispatch:

concurrency:
  group: forever-bot
  cancel-in-progress: false

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      TOKEN: ${{ secrets.TOKEN }}
      UPLOAD_DIR: /tmp/uploads
      TOTAL_DURATION: 18000
      CHECK_INTERVAL: 30
      LOCAL_API_URL: http://localhost:8081   # بدون /bot

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install python-telegram-bot==20.7 aiohttp aiofiles

      - name: Start Telegram Bot API Server (Local)
        run: |
          # اجرای سرور محلی با متغیرهای محیطی (نه پارامترهای خط فرمان)
          docker run -d --restart=unless-stopped --name=telegram-bot-api \
            -p 8081:8081 \
            -e TELEGRAM_BOT_API_TOKEN=${{ secrets.TOKEN }} \
            -e TELEGRAM_BOT_API_LOCAL="true" \
            -e TELEGRAM_BOT_API_HTTP_PORT="8081" \
            aiogram/telegram-bot-api:latest
          
          # صبر برای آماده شدن سرور
          sleep 8
          
          # تست اتصال به سرور محلی
          if curl -s http://localhost:8081/getMe; then
            echo "✅ سرور محلی Bot API راه‌اندازی شد."
          else
            echo "❌ سرور محلی پاسخ نمی‌دهد"
            docker logs telegram-bot-api
            exit 1
          fi

      - name: Create upload directory
        run: mkdir -p ${{ env.UPLOAD_DIR }}

      - name: Write bot script
        run: |
          cat << 'EOF' > bot.py
          import os
          import asyncio
          import time
          import threading
          import logging
          import traceback
          from datetime import datetime, timedelta
          from pathlib import Path
          from telegram import Update
          from telegram.ext import Application, CommandHandler, MessageHandler, filters, ContextTypes
          import aiohttp
          import aiofiles

          # ========== تنظیمات ==========
          TOKEN = os.environ['TOKEN']
          UPLOAD_DIR = Path(os.environ.get('UPLOAD_DIR', '/tmp/uploads'))
          UPLOAD_DIR.mkdir(exist_ok=True)
          TUNNEL_URL_FILE = Path('tunnel-url.txt')
          EXPIRY_DURATION = timedelta(seconds=7200)   # ۲ ساعت
          ALLOWED_USERNAME = 'a_exhausted'
          LOCAL_API_URL = os.environ.get('LOCAL_API_URL', 'http://localhost:8081')

          file_expiry = {}

          logging.basicConfig(level=logging.INFO)
          logger = logging.getLogger(__name__)

          def get_tunnel_url():
              if TUNNEL_URL_FILE.exists():
                  return TUNNEL_URL_FILE.read_text().strip()
              return None

          def cleaner():
              while True:
                  now = datetime.now()
                  to_delete = [f for f, exp in file_expiry.items() if exp < now]
                  for f in to_delete:
                      fp = UPLOAD_DIR / f
                      if fp.exists():
                          fp.unlink()
                          logger.info(f"Deleted expired file: {f}")
                      del file_expiry[f]
                  time.sleep(60)

          async def send_error(update: Update, error_text: str):
              if len(error_text) > 4000:
                  for i in range(0, len(error_text), 4000):
                      await update.message.reply_text(error_text[i:i+4000])
              else:
                  await update.message.reply_text(error_text)

          async def start(update: Update, context: ContextTypes.DEFAULT_TYPE):
              try:
                  user = update.effective_user
                  if user.username != ALLOWED_USERNAME:
                      await update.message.reply_text("⛔ شما مجاز به استفاده از این ربات نیستید.")
                      return
                  await update.message.reply_text(
                      "👋 سلام! فایل، عکس یا ویدیو بفرستید تا لینک دریافت کنید.\n"
                      f"⏳ هر لینک به مدت {EXPIRY_DURATION.seconds//3600} ساعت معتبر است.\n"
                      "📦 **حداکثر حجم: ۲ گیگابایت** (با سرور محلی)"
                  )
              except Exception as e:
                  tb = traceback.format_exc()
                  await send_error(update, f"❌ خطا در start:\n\n{str(e)}\n\n{tb}")

          async def handle_file(update: Update, context: ContextTypes.DEFAULT_TYPE):
              try:
                  user = update.effective_user
                  if user.username != ALLOWED_USERNAME:
                      await update.message.reply_text("⛔ شما مجاز به استفاده از این ربات نیستید.")
                      return

                  base_url = get_tunnel_url()
                  if not base_url:
                      await update.message.reply_text("❌ سرویس دهی موقتاً در دسترس نیست. لحظاتی بعد تلاش کنید.")
                      return

                  doc = update.message.document
                  photo = update.message.photo
                  video = update.message.video
                  if doc:
                      file_obj = doc
                      ext = os.path.splitext(doc.file_name or '')[1] if doc.file_name else '.bin'
                      fname = f"{int(time.time())}_{doc.file_unique_id}{ext}"
                  elif photo:
                      file_obj = photo[-1]
                      fname = f"{int(time.time())}_{file_obj.file_unique_id}.jpg"
                  elif video:
                      file_obj = video
                      fname = f"{int(time.time())}_{file_obj.file_unique_id}.mp4"
                  else:
                      await update.message.reply_text("❌ فقط فایل، عکس و ویدیو پشتیبانی می‌شود.")
                      return

                  file_path = UPLOAD_DIR / fname

                  # ===== دانلود با سرور محلی =====
                  try:
                      tg_file = await context.bot.get_file(file_obj.file_id)
                      await tg_file.download_to_drive(file_path)
                  except Exception as e:
                      tb = traceback.format_exc()
                      error_msg = f"❌ خطا در دانلود فایل:\n\n{str(e)}\n\n{tb}"
                      await send_error(update, error_msg)
                      return

                  expiry_time = datetime.now() + EXPIRY_DURATION
                  file_expiry[fname] = expiry_time

                  link = f"{base_url}/{fname}"
                  await update.message.reply_text(
                      f"✅ فایل ذخیره شد.\n"
                      f"🔗 لینک: {link}\n"
                      f"⏳ اعتبار تا: {expiry_time.strftime('%Y-%m-%d %H:%M:%S')}"
                  )

              except Exception as e:
                  tb = traceback.format_exc()
                  error_msg = f"❌ خطای غیرمنتظره:\n\n{str(e)}\n\n{tb}"
                  await send_error(update, error_msg)

          def main():
              # پاک‌کننده فایل‌های منقضی
              t = threading.Thread(target=cleaner, daemon=True)
              t.start()

              # ===== راه‌اندازی ربات با سرور محلی =====
              application = (
                  Application.builder()
                  .token(TOKEN)
                  .base_url(LOCAL_API_URL)          # اتصال به سرور محلی
                  .local_mode(True)                 # فعال‌سازی حالت محلی
                  .connect_timeout(60.0)
                  .read_timeout(120.0)
                  .build()
              )

              application.add_handler(CommandHandler("start", start))
              application.add_handler(MessageHandler(filters.ALL & ~filters.COMMAND, handle_file))

              logger.info("ربات با سرور محلی Bot API شروع به کار کرد.")
              application.run_polling()

          if __name__ == "__main__":
              main()
          EOF

      - name: Start web server
        run: |
          cd ${{ env.UPLOAD_DIR }}
          python3 -m http.server 8080 &
          echo $! > /tmp/webserver.pid

      - name: Install cloudflared & initial tunnel
        run: |
          curl -L https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o cloudflared
          chmod +x cloudflared
          ./cloudflared tunnel --url http://localhost:8080 --no-autoupdate > cloudflare.log 2>&1 &
          sleep 8
          TUNNEL_URL=$(grep -oP 'https://[a-zA-Z0-9.-]+\.trycloudflare\.com' cloudflare.log | head -n1)
          if [ -z "$TUNNEL_URL" ]; then
            echo "❌ خطا در دریافت آدرس تونل"
            cat cloudflare.log
            exit 1
          fi
          echo "$TUNNEL_URL" > tunnel-url.txt
          echo "✅ تونل ایجاد شد: $TUNNEL_URL"

      - name: Run bot in background
        run: |
          python3 bot.py &
          echo $! > /tmp/bot.pid

      - name: Keep alive (5 hours) with monitoring
        run: |
          set +e
          END_TIME=$(( $(date +%s) + ${{ env.TOTAL_DURATION }} ))
          echo "⏳ نگهبانی به مدت ۵ ساعت..."

          while [ $(date +%s) -lt $END_TIME ]; do
            # ===== بررسی سلامت تونل =====
            TUNNEL_URL=$(cat tunnel-url.txt 2>/dev/null)
            if [ -n "$TUNNEL_URL" ]; then
              HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --connect-timeout 5 "$TUNNEL_URL" 2>/dev/null || echo "000")
              if [ "$HTTP_CODE" != "200" ]; then
                echo "⚠️ تونل پاسخ نمی‌دهد (کد: $HTTP_CODE) - راه‌اندازی مجدد..."
                pkill cloudflared || true
                sleep 2
                ./cloudflared tunnel --url http://localhost:8080 --no-autoupdate > cloudflare.log 2>&1 &
                sleep 8
                NEW_URL=$(grep -oP 'https://[a-zA-Z0-9.-]+\.trycloudflare\.com' cloudflare.log | head -n1)
                if [ -n "$NEW_URL" ]; then
                  echo "$NEW_URL" > tunnel-url.txt
                  echo "🔄 آدرس جدید تونل: $NEW_URL"
                else
                  echo "❌ راه‌اندازی مجدد تونل ناموفق"
                fi
              else
                echo "✅ تونل سالم است (HTTP $HTTP_CODE)"
              fi
            else
              echo "⚠️ فایل آدرس تونل وجود ندارد - تلاش مجدد..."
            fi

            # ===== بررسی سلامت ربات =====
            if ! kill -0 $(cat /tmp/bot.pid) 2>/dev/null; then
              echo "⚠️ ربات متوقف شده - راه‌اندازی مجدد..."
              python3 bot.py &
              echo $! > /tmp/bot.pid
            fi

            REMAINING=$((END_TIME - $(date +%s)))
            echo "[$(date +%H:%M:%S)] زمان باقی‌مانده: $((REMAINING/60)) دقیقه و $((REMAINING%60)) ثانیه"

            sleep ${{ env.CHECK_INTERVAL }}
          done

          echo "✅ زمان نگهبانی به پایان رسید."

      - name: Cleanup
        if: always()
        run: |
          docker stop telegram-bot-api || true
          docker rm telegram-bot-api || true
          kill $(cat /tmp/bot.pid) 2>/dev/null || true
          kill $(cat /tmp/webserver.pid) 2>/dev/null || true
          pkill cloudflared || true
          rm -rf ${{ env.UPLOAD_DIR }}/*
          echo "🧹 پاک‌سازی انجام شد."