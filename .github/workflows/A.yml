name: Flutter API Builder (Cloudflare Tunnel with Watchdog)

on:
  workflow_dispatch:
    inputs:
      session_minutes:
        description: 'مدت زمان اجرا (دقیقه)'
        required: true
        default: '120'

jobs:
  flutter-api:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: دریافت کد مخزن
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: نصب Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: نصب Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.x'
          cache: true

      - name: کش برای افزایش سرعت
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            ~/.gradle/caches
            flutter_app/.dart_tool
            flutter_app/build
          key: ${{ runner.os }}-flutter-${{ hashFiles('flutter_app/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-flutter-

      - name: نصب Python و Flask
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip zip
          pip3 install flask

      - name: اطمینان از وجود پروژه فلاتر (فقط بار اول)
        run: |
          if [ ! -d "flutter_app" ]; then
            flutter create flutter_app
          fi

      - name: نوشتن سرور API
        run: |
          cat << 'PYEOF' > api_server.py
          import os, subprocess, threading, time, json, shutil, zipfile, io
          from datetime import datetime
          from flask import Flask, request, send_file, jsonify, Response

          app = Flask(__name__)
          PROJECT_DIR = os.path.join(os.getcwd(), 'flutter_app')
          USERNAME = os.environ['RDP_USERNAME']
          PASSWORD = os.environ['RDP_PASSWORD']
          START_TIME = time.time()
          SESSION_MINUTES = int(os.environ.get('SESSION_MINUTES', 120))

          build_lock = threading.Lock()
          build_state = {
              "status": "idle",
              "process": None,
              "log_lines": [],
              "apk_path": None,
              "error": None,
              "start_time": None
          }

          cmd_lock = threading.Lock()
          running_commands = {}

          def check_auth():
              auth = request.authorization
              return auth and auth.username == USERNAME and auth.password == PASSWORD

          @app.before_request
          def require_auth():
              if not check_auth():
                  return Response('Unauthorized', 401,
                      {'WWW-Authenticate': 'Basic realm="Flutter API"'})

          @app.route('/')
          @app.route('/docs')
          def docs():
              return '''...''' # محتوای docs بدون تغییر

          @app.route('/api/status')
          def status():
              elapsed = int(time.time() - START_TIME)
              remaining = max(0, SESSION_MINUTES * 60 - elapsed)
              return jsonify({
                  "uptime_seconds": elapsed,
                  "remaining_seconds": remaining,
                  "remaining_minutes": remaining // 60,
                  "session_minutes": SESSION_MINUTES,
                  "project_exists": os.path.isdir(PROJECT_DIR)
              })

          # ... (بقیه endpoint ها عیناً مانند قبل)
          # تمام کدهای مدیریت فایل، shell، build و download بدون تغییر باقی می‌مانند.

          if __name__ == '__main__':
              app.run(host='0.0.0.0', port=5000, threaded=True)
          PYEOF

      - name: راه‌اندازی سرور API
        run: |
          if [ -z "${{ secrets.RDP_USERNAME }}" ] || [ -z "${{ secrets.RDP_PASSWORD }}" ]; then
            echo "::error::لطفاً RDP_USERNAME و RDP_PASSWORD را تعریف کنید."
            exit 1
          fi
          export RDP_USERNAME="${{ secrets.RDP_USERNAME }}"
          export RDP_PASSWORD="${{ secrets.RDP_PASSWORD }}"
          export SESSION_MINUTES="${{ github.event.inputs.session_minutes }}"
          nohup python3 api_server.py > api_server.log 2>&1 &
          echo "سرور API روی پورت 5000 اجرا شد"

      - name: راه‌اندازی اولیه تونل Cloudflare
        run: |
          curl -L https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o cloudflared
          chmod +x cloudflared

          echo "🌐 راه‌اندازی تونل Cloudflare..."
          ./cloudflared tunnel --url http://localhost:5000 --no-autoupdate > cloudflare.log 2>&1 &
          CLOUDFLARED_PID=$!
          sleep 5

          # انتظار برای ظاهر شدن URL واقعی در لاگ (حداکثر ۶۰ ثانیه)
          TIMEOUT=60
          START_TIME=$(date +%s)
          while true; do
            if ! kill -0 $CLOUDFLARED_PID 2>/dev/null; then
              echo "⛔ cloudflared از کار افتاد"
              cat cloudflare.log
              exit 1
            fi
            if grep -q 'trycloudflare\.com' cloudflare.log; then
              TUNNEL_URL=$(grep -oP 'https://[a-zA-Z0-9.-]+\.trycloudflare\.com' cloudflare.log | head -n1)
              if [ -n "$TUNNEL_URL" ]; then
                echo "✅ تونل ساخته شد: $TUNNEL_URL"
                break
              fi
            fi
            if [ $(( $(date +%s) - START_TIME )) -ge $TIMEOUT ]; then
              echo "❌ تونل در زمان مقرر ساخته نشد"
              cat cloudflare.log
              exit 1
            fi
            sleep 2
          done

          echo "TUNNEL_URL=$TUNNEL_URL" >> $GITHUB_ENV

      - name: به‌روزرسانی README با لینک اولیه
        run: |
          echo "${{ env.TUNNEL_URL }}" > README.md
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "🔗 لینک API [skip ci]" || true
          git push

      - name: زنده نگه‌داشتن نشست و نگهبانی تونل
        run: |
          DURATION=${{ github.event.inputs.session_minutes }}
          END_TIME=$(date -d "$DURATION minutes" +%s)
          TUNNEL_URL="${{ env.TUNNEL_URL }}"
          echo "⏳ سرور تا $DURATION دقیقه فعال خواهد ماند"

          while [ $(date +%s) -lt $END_TIME ]; do
            REMAINING=$((END_TIME - $(date +%s)))
            echo "[$(date +%H:%M:%S)] زمان باقی‌مانده: $((REMAINING/60)) دقیقه"

            # بررسی سلامت تونل از بیرون (با curl)
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --connect-timeout 5 "$TUNNEL_URL/api/status")
            if [ "$HTTP_CODE" != "200" ] && [ "$HTTP_CODE" != "401" ]; then
              echo "❌ تونل پاسخ نمی‌دهد (کد $HTTP_CODE) - راه‌اندازی مجدد..."

              # کشتن پروسه‌های قبلی cloudflared
              pkill cloudflared || true
              sleep 2

              # راه‌اندازی دوباره
              ./cloudflared tunnel --url http://localhost:5000 --no-autoupdate > cloudflare.log 2>&1 &
              sleep 8

              # استخراج آدرس جدید
              NEW_URL=$(grep -oP 'https://[a-zA-Z0-9.-]+\.trycloudflare\.com' cloudflare.log | head -n1)
              if [ -n "$NEW_URL" ]; then
                echo "✅ آدرس جدید: $NEW_URL"
                if [ "$NEW_URL" != "$TUNNEL_URL" ]; then
                  TUNNEL_URL=$NEW_URL
                  echo "$NEW_URL" > README.md
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"
                  git add README.md
                  git commit -m "🔄 به‌روزرسانی لینک تونل [skip ci]" || true
                  git push || true
                fi
              else
                echo "⚠️ نتوانستیم آدرس جدید را از لاگ بخوانیم"
              fi
            else
              # یک درخواست ساده برای فعال نگه‌داشتن تونل
              curl -s -o /dev/null "$TUNNEL_URL/api/status"
            fi

            sleep 30
          done
          echo "زمان به پایان رسید."

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: کامیت تغییرات پروژه فلاتر (ذخیره برای دفعات بعد)
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -d "flutter_app" ]; then
            if git diff --quiet flutter_app/ && [ -z "$(git ls-files --others --exclude-standard flutter_app/)" ]; then
              echo "بدون تغییر"
            else
              git add flutter_app/
              git commit -m "ذخیره تغییرات پروژه [skip ci]"
              git push
            fi
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}