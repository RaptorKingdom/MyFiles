name: Flutter API Builder (Bore Tunnel)

on:
  workflow_dispatch:
    inputs:
      session_minutes:
        description: 'مدت زمان اجرا (دقیقه)'
        required: true
        default: '120'

jobs:
  flutter-api:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: دریافت کد مخزن (شامل پروژه فلاتر قبلی)
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: نصب Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: نصب Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'

      - name: کش برای افزایش سرعت
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            ~/.gradle/caches
            flutter_app/.dart_tool
            flutter_app/build
          key: ${{ runner.os }}-flutter-${{ hashFiles('flutter_app/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-flutter-

      - name: نصب Python و Flask
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip zip
          pip3 install flask

      - name: اطمینان از وجود پروژه فلاتر (فقط بار اول)
        run: |
          if [ ! -d "flutter_app" ]; then
            flutter create flutter_app
          fi

      - name: نوشتن سرور API (با قابلیت‌های پیشرفته)
        run: |
          cat << 'PYEOF' > api_server.py
          import os, subprocess, threading, time, json, shutil, zipfile, io, signal, pty, select
          from datetime import datetime
          from flask import Flask, request, send_file, jsonify, Response, make_response

          app = Flask(__name__)
          PROJECT_DIR = os.path.join(os.getcwd(), 'flutter_app')
          USERNAME = os.environ['WEB_USERNAME']
          PASSWORD = os.environ['WEB_PASSWORD']
          START_TIME = time.time()
          SESSION_MINUTES = int(os.environ.get('SESSION_MINUTES', 120))

          build_lock = threading.Lock()
          build_state = {
              "status": "idle",
              "process": None,
              "log_lines": [],
              "apk_path": None,
              "error": None,
              "start_time": None
          }

          # برای دستورات سفارشی
          cmd_lock = threading.Lock()
          running_commands = {}

          def check_auth():
              auth = request.authorization
              return auth and auth.username == USERNAME and auth.password == PASSWORD

          @app.before_request
          def require_auth():
              if not check_auth():
                  return Response('Unauthorized', 401,
                      {'WWW-Authenticate': 'Basic realm="Flutter API"'})

          # ==================== مستندات پیشرفته ====================
          @app.route('/')
          @app.route('/docs')
          def docs():
              return '''<!doctype html>
          <html lang="en">
          <head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
          <title>Flutter API Docs</title>
          <style>
              * { box-sizing: border-box; }
              body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; max-width: 1000px; margin: auto; padding: 20px; background: #0d1117; color: #c9d1d9; }
              h1 { color: #58a6ff; font-size: 2em; margin-top: 0; }
              h2 { color: #3fb950; border-bottom: 2px solid #30363d; padding-bottom: 8px; margin-top: 30px; }
              code { background: #161b22; padding: 3px 8px; border-radius: 4px; color: #f0883e; font-size: 0.9em; }
              pre { background: #161b22; padding: 15px; border-radius: 8px; overflow-x: auto; color: #e6edf3; border: 1px solid #30363d; }
              .method { color: #ff7b72; font-weight: bold; display: inline-block; min-width: 60px; }
              .endpoint { color: #7ee787; font-weight: bold; }
              .section { background: #161b22; border: 1px solid #30363d; border-radius: 10px; padding: 20px; margin: 20px 0; }
              .warning { background: #2d1b1b; border: 1px solid #ff4444; color: #ff8888; padding: 10px; border-radius: 6px; margin: 10px 0; }
              table { width: 100%; border-collapse: collapse; margin: 15px 0; }
              th, td { text-align: left; padding: 10px; border-bottom: 1px solid #30363d; }
              th { color: #58a6ff; }
              @media (max-width: 768px) {
                  body { padding: 10px; }
                  pre { font-size: 0.8em; }
              }
          </style></head>
          <body>
          <h1>📘 Flutter Build API</h1>
          <p>Authentication: <strong>HTTP Basic Auth</strong> (از Secrets مخزن)</p>

          <div class="section">
              <h2>📡 وضعیت سرور</h2>
              <p><span class="method">GET</span> <span class="endpoint">/api/status</span> – وضعیت و زمان باقی‌مانده</p>
              <pre>curl -u user:pass http://host/api/status</pre>
          </div>

          <div class="section">
              <h2>📁 مدیریت فایل‌ها</h2>
              <table>
                  <tr><th>متد</th><th>آدرس</th><th>توضیح</th></tr>
                  <tr><td><span class="method">GET</span></td><td><span class="endpoint">/api/files</span></td><td>فهرست کل پروژه (بازگشتی)</td></tr>
                  <tr><td><span class="method">GET</span></td><td><span class="endpoint">/api/files/&lt;path&gt;</span></td><td>دریافت محتوای فایل</td></tr>
                  <tr><td><span class="method">PUT</span></td><td><span class="endpoint">/api/files/&lt;path&gt;</span></td><td>بازنویسی فایل (body = محتوا)</td></tr>
                  <tr><td><span class="method">DELETE</span></td><td><span class="endpoint">/api/files/&lt;path&gt;</span></td><td>حذف فایل یا پوشه</td></tr>
                  <tr><td><span class="method">POST</span></td><td><span class="endpoint">/api/files/&lt;path&gt;?action=mkdir</span></td><td>ایجاد پوشه</td></tr>
                  <tr><td><span class="method">POST</span></td><td><span class="endpoint">/api/files/upload</span></td><td>آپلود فایل (multipart, field: file, query: dest)</td></tr>
                  <tr><td><span class="method">GET</span></td><td><span class="endpoint">/api/project/export</span></td><td>دانلود کل پروژه (zip)</td></tr>
                  <tr><td><span class="method">GET</span></td><td><span class="endpoint">/api/project/info</span></td><td>اطلاعات پروژه (نام، نسخه، پکیج‌ها)</td></tr>
              </table>
              <pre># فهرست فایل‌ها
          curl -u user:pass http://host/api/files

          # دریافت فایل
          curl -u user:pass http://host/api/files/lib/main.dart

          # ویرایش فایل
          curl -X PUT -u user:pass -d "import 'package:flutter/material.dart';" http://host/api/files/lib/main.dart

          # حذف فایل
          curl -X DELETE -u user:pass http://host/api/files/test.txt

          # ایجاد پوشه
          curl -X POST -u user:pass "http://host/api/files/new_folder?action=mkdir"

          # آپلود فایل
          curl -X POST -u user:pass -F "file=@local.dart" "http://host/api/files/upload?dest=lib/local.dart"

          # خروجی zip
          curl -u user:pass -o project.zip http://host/api/project/export</pre>
          </div>

          <div class="section">
              <h2>⚡ اجرای هر دستور (Shell)</h2>
              <div class="warning">⚠️ کاربر می‌تواند هر دستور shell را اجرا کند. دسترسی کامل به محیط.</div>
              <table>
                  <tr><th>متد</th><th>آدرس</th><th>توضیح</th></tr>
                  <tr><td><span class="method">POST</span></td><td><span class="endpoint">/api/exec</span></td><td>اجرای دستور (body: {"command":"ls -la"})</td></tr>
                  <tr><td><span class="method">POST</span></td><td><span class="endpoint">/api/exec-async</span></td><td>اجرای غیرهمزمان (body: {"command":"sleep 10"}, برگرداندن job_id)</td></tr>
                  <tr><td><span class="method">GET</span></td><td><span class="endpoint">/api/exec-async/&lt;job_id&gt;</span></td><td>بررسی وضعیت job (در حال اجرا / خروجی)</td></tr>
              </table>
              <pre># اجرای همزمان (منتظر خروجی می‌ماند)
          curl -X POST -u user:pass -H "Content-Type: application/json" -d '{"command":"flutter pub get"}' http://host/api/exec

          # اجرای غیرهمزمان
          curl -X POST -u user:pass -H "Content-Type: application/json" -d '{"command":"flutter analyze"}' http://host/api/exec-async

          # بررسی job
          curl -u user:pass http://host/api/exec-async/abc123

          # دستورات عمومی
          curl -X POST -u user:pass -H "Content-Type: application/json" -d '{"command":"ls -la"}' http://host/api/exec
          curl -X POST -u user:pass -H "Content-Type: application/json" -d '{"command":"cat pubspec.yaml"}' http://host/api/exec</pre>
          </div>

          <div class="section">
              <h2>🛠️ بیلد APK</h2>
              <table>
                  <tr><th>متد</th><th>آدرس</th><th>توضیح</th></tr>
                  <tr><td><span class="method">POST</span></td><td><span class="endpoint">/api/build</span></td><td>شروع بیلد (arm64-v8a)</td></tr>
                  <tr><td><span class="method">GET</span></td><td><span class="endpoint">/api/build</span></td><td>وضعیت + تمام لاگ‌ها</td></tr>
                  <tr><td><span class="method">GET</span></td><td><span class="endpoint">/api/download</span></td><td>دانلود APK</td></tr>
              </table>
              <pre># شروع بیلد
          curl -X POST -u user:pass http://host/api/build

          # بررسی پیشرفت
          curl -u user:pass http://host/api/build

          # دانلود APK
          curl -u user:pass -o app.apk http://host/api/download</pre>
          </div>

          <div class="section">
              <h2>📊 پاسخ وضعیت بیلد</h2>
              <pre>{
            "status": "idle|running|success|failed",
            "log": ["خط ۱\\n", "خط ۲\\n", ...],
            "apk_available": true|false,
            "error": null|"پیغام خطا",
            "start_time": 1234567890.0
          }</pre>
          </div>
          </body></html>'''

          # ==================== وضعیت سرور ====================
          @app.route('/api/status')
          def status():
              elapsed = int(time.time() - START_TIME)
              remaining = max(0, SESSION_MINUTES * 60 - elapsed)
              return jsonify({
                  "uptime_seconds": elapsed,
                  "remaining_seconds": remaining,
                  "remaining_minutes": remaining // 60,
                  "session_minutes": SESSION_MINUTES,
                  "project_exists": os.path.isdir(PROJECT_DIR),
                  "flutter_version": subprocess.run(['flutter', '--version'], capture_output=True, text=True, cwd=PROJECT_DIR).stdout.split('\n')[0] if os.path.isdir(PROJECT_DIR) else "N/A"
              })

          # ==================== مدیریت فایل‌ها ====================
          def safe_path(rel):
              full = os.path.normpath(os.path.join(PROJECT_DIR, rel))
              if not full.startswith(PROJECT_DIR):
                  return None
              return full

          @app.route('/api/files', defaults={'filepath': ''})
          @app.route('/api/files/<path:filepath>', methods=['GET', 'PUT', 'DELETE', 'POST'])
          def handle_files(filepath):
              full = safe_path(filepath)
              if full is None:
                  return jsonify({"error": "مسیر غیرمجاز"}), 403

              if request.method == 'GET':
                  if not os.path.exists(full):
                      return jsonify({"error": "یافت نشد"}), 404
                  if os.path.isdir(full):
                      items = []
                      try:
                          for name in sorted(os.listdir(full)):
                              p = os.path.join(full, name)
                              rel_path = os.path.relpath(p, PROJECT_DIR).replace('\\', '/')
                              st = os.stat(p)
                              items.append({
                                  "name": name,
                                  "type": "dir" if os.path.isdir(p) else "file",
                                  "path": rel_path,
                                  "size": st.st_size,
                                  "modified": st.st_mtime
                              })
                      except PermissionError:
                          return jsonify({"error": "دسترسی غیرمجاز"}), 403
                      return jsonify(items)
                  else:
                      try:
                          with open(full, 'r', errors='ignore') as f:
                              content = f.read()
                          return jsonify({
                              "path": filepath,
                              "content": content,
                              "size": os.path.getsize(full),
                              "modified": os.path.getmtime(full)
                          })
                      except:
                          return jsonify({"error": "فایل قابل خواندن نیست"}), 500

              elif request.method == 'PUT':
                  os.makedirs(os.path.dirname(full), exist_ok=True)
                  content = request.get_data(as_text=True)
                  with open(full, 'w') as f:
                      f.write(content)
                  return jsonify({"status": "ok", "path": filepath, "size": len(content)})

              elif request.method == 'DELETE':
                  if not os.path.exists(full):
                      return jsonify({"error": "یافت نشد"}), 404
                  try:
                      if os.path.isdir(full):
                          shutil.rmtree(full)
                      else:
                          os.remove(full)
                      return jsonify({"status": "deleted"})
                  except Exception as e:
                      return jsonify({"error": str(e)}), 500

              elif request.method == 'POST':
                  action = request.args.get('action', '')
                  if action == 'mkdir':
                      os.makedirs(full, exist_ok=True)
                      return jsonify({"status": "directory created"})
                  return jsonify({"error": "action نامعتبر"}), 400

          @app.route('/api/files/upload', methods=['POST'])
          def upload_file():
              if 'file' not in request.files:
                  return jsonify({"error": "فایلی ارسال نشده"}), 400
              file = request.files['file']
              if file.filename == '':
                  return jsonify({"error": "نام فایل خالی"}), 400
              dest = request.args.get('dest', file.filename)
              if not dest:
                  return jsonify({"error": "مسیر مقصد مشخص نشده"}), 400
              full = safe_path(dest)
              if full is None:
                  return jsonify({"error": "مسیر غیرمجاز"}), 403
              os.makedirs(os.path.dirname(full), exist_ok=True)
              file.save(full)
              return jsonify({"status": "uploaded", "path": dest, "size": os.path.getsize(full)})

          @app.route('/api/project/export')
          def export_project():
              memory_file = io.BytesIO()
              with zipfile.ZipFile(memory_file, 'w', zipfile.ZIP_DEFLATED) as zf:
                  for root, dirs, files in os.walk(PROJECT_DIR):
                      dirs[:] = [d for d in dirs if d not in ['.dart_tool', 'build', '.gradle', 'android/.gradle']]
                      for file in files:
                          full_path = os.path.join(root, file)
                          arcname = os.path.relpath(full_path, PROJECT_DIR)
                          zf.write(full_path, arcname)
              memory_file.seek(0)
              return send_file(memory_file, mimetype='application/zip',
                               as_attachment=True, download_name='flutter_project.zip')

          @app.route('/api/project/info')
          def project_info():
              pubspec = os.path.join(PROJECT_DIR, 'pubspec.yaml')
              info = {"project_dir": PROJECT_DIR}
              if os.path.exists(pubspec):
                  with open(pubspec, 'r') as f:
                      content = f.read()
                  info['pubspec_content'] = content
                  for line in content.split('\n'):
                      line = line.strip()
                      if line.startswith('name:'):
                          info['name'] = line.split(':')[1].strip()
                      elif line.startswith('version:'):
                          info['version'] = line.split(':')[1].strip()
                      elif line.startswith('description:'):
                          info['description'] = line.split(':', 1)[1].strip()
              # تعداد فایل‌ها
              file_count = sum(len(files) for _, _, files in os.walk(PROJECT_DIR))
              info['total_files'] = file_count
              return jsonify(info)

          # ==================== اجرای دستورات ====================
          @app.route('/api/exec', methods=['POST'])
          def exec_command():
              data = request.get_json(silent=True)
              if not data or 'command' not in data:
                  return jsonify({"error": "فیلد command لازم است"}), 400
              cmd = data['command']
              timeout = data.get('timeout', 300)  # 5 دقیقه پیش‌فرض
              working_dir = data.get('working_dir', PROJECT_DIR)
              if not os.path.isdir(working_dir):
                  return jsonify({"error": "مسیر کاری نامعتبر"}), 400
              try:
                  result = subprocess.run(
                      cmd,
                      shell=True,
                      cwd=working_dir,
                      capture_output=True,
                      text=True,
                      timeout=timeout
                  )
                  return jsonify({
                      "stdout": result.stdout,
                      "stderr": result.stderr,
                      "exit_code": result.returncode,
                      "command": cmd
                  })
              except subprocess.TimeoutExpired:
                  return jsonify({"error": f"زمان اجرا ({timeout}s) پایان یافت"}), 504
              except Exception as e:
                  return jsonify({"error": str(e)}), 500

          @app.route('/api/exec-async', methods=['POST'])
          def exec_async():
              data = request.get_json(silent=True)
              if not data or 'command' not in data:
                  return jsonify({"error": "فیلد command لازم است"}), 400
              cmd = data['command']
              timeout = data.get('timeout', 300)
              working_dir = data.get('working_dir', PROJECT_DIR)
              job_id = datetime.now().strftime('%Y%m%d%H%M%S%f')
              with cmd_lock:
                  running_commands[job_id] = {
                      "command": cmd,
                      "start_time": time.time(),
                      "status": "running",
                      "stdout": [],
                      "stderr": [],
                      "exit_code": None,
                      "process": None
                  }
              t = threading.Thread(target=_run_async_cmd, args=(job_id, cmd, timeout, working_dir))
              t.daemon = True
              t.start()
              return jsonify({"job_id": job_id, "command": cmd, "status": "running"})

          def _run_async_cmd(job_id, cmd, timeout, working_dir):
              try:
                  process = subprocess.Popen(
                      cmd,
                      shell=True,
                      cwd=working_dir,
                      stdout=subprocess.PIPE,
                      stderr=subprocess.PIPE,
                      text=True
                  )
                  with cmd_lock:
                      if job_id in running_commands:
                          running_commands[job_id]['process'] = process
                  stdout_lines = []
                  stderr_lines = []
                  for line in process.stdout:
                      stdout_lines.append(line)
                      with cmd_lock:
                          if job_id in running_commands:
                              running_commands[job_id]['stdout'].append(line)
                  for line in process.stderr:
                      stderr_lines.append(line)
                      with cmd_lock:
                          if job_id in running_commands:
                              running_commands[job_id]['stderr'].append(line)
                  process.wait()
                  with cmd_lock:
                      if job_id in running_commands:
                          running_commands[job_id]['status'] = 'done'
                          running_commands[job_id]['exit_code'] = process.returncode
              except Exception as e:
                  with cmd_lock:
                      if job_id in running_commands:
                          running_commands[job_id]['status'] = 'error'
                          running_commands[job_id]['error'] = str(e)

          @app.route('/api/exec-async/<job_id>')
          def exec_async_status(job_id):
              with cmd_lock:
                  if job_id not in running_commands:
                      return jsonify({"error": "job_id نامعتبر"}), 404
                  job = running_commands[job_id]
                  response = {
                      "job_id": job_id,
                      "command": job['command'],
                      "status": job['status'],
                      "stdout": ''.join(job['stdout']),
                      "stderr": ''.join(job['stderr']),
                      "exit_code": job['exit_code']
                  }
                  if job['status'] == 'done' or job['status'] == 'error':
                      del running_commands[job_id]
                  return jsonify(response)

          # ==================== بیلد ====================
          @app.route('/api/build', methods=['POST'])
          def start_build():
              global build_state
              with build_lock:
                  if build_state['status'] == 'running':
                      return jsonify({"error": "یک بیلد در حال انجام است"}), 409
                  build_state['status'] = 'running'
                  build_state['log_lines'] = []
                  build_state['apk_path'] = None
                  build_state['error'] = None
                  build_state['start_time'] = time.time()
                  build_state['process'] = None
              t = threading.Thread(target=run_build)
              t.daemon = True
              t.start()
              return jsonify({"status": "running", "message": "بیلد شروع شد"})

          def run_build():
              global build_state
              try:
                  process = subprocess.Popen(
                      ['flutter', 'build', 'apk', '--target-platform', 'android-arm64'],
                      cwd=PROJECT_DIR,
                      stdout=subprocess.PIPE,
                      stderr=subprocess.STDOUT,
                      text=True,
                      bufsize=1
                  )
                  with build_lock:
                      build_state['process'] = process
                  for line in iter(process.stdout.readline, ''):
                      with build_lock:
                          build_state['log_lines'].append(line)
                  process.wait()
                  success = process.returncode == 0
                  if success:
                      apk_src = os.path.join(PROJECT_DIR, 'build/app/outputs/flutter-apk/app-release.apk')
                      if os.path.exists(apk_src):
                          dest = os.path.join('static', 'latest.apk')
                          os.makedirs('static', exist_ok=True)
                          shutil.copy2(apk_src, dest)
                          with build_lock:
                              build_state['status'] = 'success'
                              build_state['apk_path'] = dest
                      else:
                          with build_lock:
                              build_state['status'] = 'failed'
                              build_state['error'] = 'APK یافت نشد'
                  else:
                      with build_lock:
                          build_state['status'] = 'failed'
                          build_state['error'] = 'بیلد ناموفق'
              except Exception as e:
                  with build_lock:
                      build_state['status'] = 'failed'
                      build_state['error'] = str(e)

          @app.route('/api/build', methods=['GET'])
          def build_status():
              with build_lock:
                  apk_available = build_state['apk_path'] is not None and os.path.exists(build_state['apk_path'])
                  return jsonify({
                      "status": build_state['status'],
                      "log": build_state['log_lines'],
                      "apk_available": apk_available,
                      "error": build_state['error'],
                      "start_time": build_state.get('start_time')
                  })

          @app.route('/api/download')
          def download_apk():
              with build_lock:
                  if build_state['apk_path'] and os.path.exists(build_state['apk_path']):
                      return send_file(build_state['apk_path'], as_attachment=True, download_name='app-arm64.apk')
              return jsonify({"error": "APK آماده نیست"}), 404

          if __name__ == '__main__':
              app.run(host='0.0.0.0', port=5000, threaded=True)
          PYEOF

      - name: راه‌اندازی سرور API
        run: |
          if [ -z "${{ secrets.RDP_USERNAME }}" ] || [ -z "${{ secrets.RDP_PASSWORD }}" ]; then
            echo "::error::لطفاً RDP_USERNAME و RDP_PASSWORD را در Secrets مخزن تعریف کنید."
            exit 1
          fi
          export WEB_USERNAME="${{ secrets.RDP_USERNAME }}"
          export WEB_PASSWORD="${{ secrets.RDP_PASSWORD }}"
          export SESSION_MINUTES="${{ github.event.inputs.session_minutes }}"
          nohup python3 api_server.py > api_server.log 2>&1 &
          echo "سرور API روی پورت 5000 آغاز به کار کرد"

      - name: دریافت و راه‌اندازی bore
        run: |
          wget -q https://github.com/ekzhang/bore/releases/download/v0.5.2/bore-v0.5.2-x86_64-unknown-linux-musl.tar.gz
          tar xzf bore-v0.5.2-x86_64-unknown-linux-musl.tar.gz
          chmod +x bore
          nohup ./bore local 5000 --to bore.pub > bore.log 2>&1 &
          sleep 5
          BORE_URL=$(grep -oP 'listening at \K[^ ]+' bore.log)
          if [ -z "$BORE_URL" ]; then
            echo "::error::bore راه‌اندازی نشد"
            cat bore.log
            exit 1
          fi
          echo "BORE_URL=$BORE_URL" >> $GITHUB_ENV
          echo "آدرس عمومی: http://$BORE_URL"

      - name: به‌روزرسانی README (فقط لینک)
        run: |
          WEB_URL="http://${{ env.BORE_URL }}"
          echo "$WEB_URL" > README.md
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet README.md; then
            echo "README تغییری نکرده است."
          else
            git add README.md
            git commit -m "لینک API [skip ci]"
            git push
            echo "README با لینک عمومی به‌روز شد."
          fi

      - name: زنده نگه‌داشتن نشست
        run: |
          DURATION=${{ github.event.inputs.session_minutes }}
          END_TIME=$(date -d "$DURATION minutes" +%s)
          echo "نشست به مدت $DURATION دقیقه فعال خواهد ماند"
          while [ $(date +%s) -lt $END_TIME ]; do
            REMAINING=$((END_TIME - $(date +%s)))
            echo "زمان باقی‌مانده: $((REMAINING/60)) دقیقه $((REMAINING%60)) ثانیه"
            sleep 60
          done
          echo "زمان به پایان رسید."

      - name: کامیت تغییرات پروژه فلاتر (ذخیره برای دفعات بعد)
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -d "flutter_app" ]; then
            if git diff --quiet flutter_app/ && [ -z "$(git ls-files --others --exclude-standard flutter_app/)" ]; then
              echo "پروژه فلاتر تغییری نداشته است."
            else
              git add flutter_app/
              git commit -m "ذخیره تغییرات پروژه فلاتر [skip ci]"
              git push
              echo "پروژه فلاتر برای اجرای بعدی ذخیره شد."
            fi
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}